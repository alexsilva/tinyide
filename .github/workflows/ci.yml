name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Os plugins são submódulos; sem eles a IDE sobe sem funcionalidade.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Testes do host
        run: npm test

      - name: Testes dos plugins
        run: npm run test:plugins

  fumaca:
    name: IDE em execução
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar a interface
        run: npm run build:web

      - name: Fumaça, execução, depuração e plugins
        # O Electron precisa de servidor gráfico virtual no runner.
        run: xvfb-run -a npm run test:e2e:quick

      - name: Guardar rastreamento das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
