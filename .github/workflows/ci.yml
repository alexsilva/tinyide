name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Tipos e testes do host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Os plugins são submódulos privados, fora do alcance do GITHUB_TOKEN do
      # runner; o CI verifica apenas o host. Tipos, testes e e2e dos plugins
      # rodam localmente (npm run check / npm run test:e2e).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npm run typecheck:host

      - name: Testes do host
        run: npm test

      - name: Compilar a interface
        run: npm run build:web
